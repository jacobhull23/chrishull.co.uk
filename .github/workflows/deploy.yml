# Deploy the static site to GitHub Pages on every push to main.
# No build step: copy the public files into _site and publish that,
# so working files (BRIEF.md, reference/, etc.) are never served.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Assemble site
        run: |
          mkdir _site
          cp -r *.html paintings.json images assets profile _site/
          for f in CNAME robots.txt sitemap.xml favicon.ico; do
            [ -f "$f" ] && cp "$f" _site/ || true
          done
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
